<script>window.addEventListener("error",function(e){var el=document.getElementById("bootError");if(!el){el=document.createElement("div");el.id="bootError";el.style.cssText="position:fixed;inset:20px;z-index:99999;background:#fff;border:1px solid #fecaca;border-radius:16px;padding:24px;font-family:Arial,sans-serif;color:#111827;box-shadow:0 20px 60px rgba(0,0,0,.12);direction:rtl";document.body.appendChild(el)}el.innerHTML="<h2>حدث خطأ أثناء تشغيل الواجهة</h2><p>"+(e.message||"خطأ JavaScript غير معروف")+"</p><p style="color:#64748b">تحقق من تشغيل السيرفر ثم افتح http://localhost:3000</p>"});</script>
</body>
</html>
